<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Extractor - Admin + Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div id="app" class="max-w-5xl mx-auto p-4 md:p-8">
  <h1 class="text-2xl font-bold">🎵 YT Extractor <span class="text-zinc-500 text-sm">Telegram DB</span></h1>
  
  <div class="mt-6 p-4 bg-zinc-900 rounded-xl">
    <div class="flex gap-2">
      <input v-model="q" placeholder="YouTube Video ID e.g. dQw4w9WgXcQ" class="flex-1 bg-zinc-800 rounded-lg px-4 py-2 outline-none">
      <button @click="extract" :disabled="loading" class="bg-white text-black px-5 py-2 rounded-lg font-bold">{{loading?'...':'Play'}}</button>
    </div>
    <audio v-if="audioUrl" :src="audioUrl" controls autoplay class="w-full mt-4"></audio>
    <p v-if="status" class="text-xs mt-2 text-zinc-400">{{status}}</p>
  </div>

  <div class="mt-6 grid grid-cols-3 gap-3">
    <div class="bg-zinc-900 p-4 rounded-xl"><div class="text-zinc-500 text-xs">CACHED</div><div class="text-xl font-bold">{{stats.total||0}}</div></div>
    <div class="bg-zinc-900 p-4 rounded-xl"><div class="text-zinc-500 text-xs">TOTAL HITS</div><div class="text-xl font-bold">{{stats.totalHits||0}}</div></div>
    <div class="bg-zinc-900 p-4 rounded-xl"><div class="text-zinc-500 text-xs">DB SIZE</div><div class="text-xl font-bold">{{stats.blobUsedKB||0}} KB</div></div>
  </div>

  <div v-if="isAdmin" class="mt-8">
    <h2 class="font-bold text-lg mb-3">🔧 Admin Panel</h2>
    <div class="bg-zinc-900 rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <tr class="text-zinc-500 border-b border-zinc-800"><th class="p-3 text-left">ID</th><th>Title</th><th>Hits</th><th>Action</th></tr>
        <tr v-for="s in list" :key="s.id" class="border-b border-zinc-800/50 hover:bg-zinc-800/50"><td class="p-3 font-mono text-xs">{{s.id}}</td><td class="p-3 truncate max-w-[200px]">{{s.title}}</td><td class="p-3">{{s.hits}}</td><td class="p-3"><button @click="del(s.id)" class="text-red-400 hover:text-red-300">Delete</button></td></tr>
      </table>
    </div>
  </div>

  <p v-else class="mt-8 text-xs text-zinc-600">Add ?key=YOUR_ADMIN_KEY to URL to enable admin panel</p>
</div>
<script>
const {createApp} = Vue
createApp({
  data(){return {q:'', audioUrl:'', status:'', loading:false, stats:{}, list:[], isAdmin: new URLSearchParams(location.search).get('key')}},
  async mounted(){
    this.stats = await fetch('/api/stats').then(r=>r.json())
    if(this.isAdmin){
      const key = new URLSearchParams(location.search).get('key')
      this.list = await fetch(`/api/admin/list?key=${key}`).then(r=>r.json()).catch(()=>[])
    }
  },
  methods:{
    async extract(){
      if(!this.q) return
      this.loading=true; this.status='Checking Telegram cache...'
      try{
        const r = await fetch(`/api/extract?id=${this.q.trim()}`).then(r=>r.json())
        if(r.error) throw r.error
        this.status = r.status==='cache' ? `From Telegram Cache: ${r.title}` : `Fresh uploaded: ${r.title} - Save new DB_FILE_ID: ${r.newDbFileId}`
        if(r.newDbFileId) console.log('UPDATE ENV DB_FILE_ID to', r.newDbFileId)
        const file = await fetch(`/api/file?file_id=${r.telegram_file_id}`).then(r=>r)
        this.audioUrl = file.url
        this.stats = await fetch('/api/stats').then(r=>r.json())
      }catch(e){ this.status='Error: '+e }
      this.loading=false
    },
    async del(id){
      const key = new URLSearchParams(location.search).get('key')
      await fetch(`/api/admin/delete?key=${key}&id=${id}`)
      this.list = this.list.filter(x=>x.id!==id)
    }
  }
}).mount('#app')
</script>
</body>
</html>
